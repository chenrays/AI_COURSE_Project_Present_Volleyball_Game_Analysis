<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排球 AI 分析系統展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 0px; /* 手機版收合時完全隱藏 */
            --primary-color: #ef4444;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative; /* 為了讓側邊欄定位 */
        }

        /* --- 側邊欄樣式 --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-panel);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed) ease, width var(--transition-speed) ease;
            position: relative;
            flex-shrink: 0;
            z-index: 100; /* 確保在影片上層 */
            height: 100%;
        }

        /* 電腦版收合樣式 */
        .sidebar.collapsed { width: 60px; }

        .logo-area {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar.collapsed .logo-area span { opacity: 0; display: none; }
        .sidebar.collapsed .logo-area i { margin: 0 auto; font-size: 1.5rem; }

        .toggle-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-speed);
            z-index: 10;
        }
        .sidebar.collapsed .toggle-btn { right: 15px; transform: rotate(180deg); }

        .menu-list { list-style: none; margin-top: 20px; padding: 0 10px; }
        .menu-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-gray);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }
        .menu-item:hover { background-color: #334155; color: white; }
        .menu-item.active { background-color: var(--primary-color); color: white; }
        .menu-item i { min-width: 30px; font-size: 1.1rem; text-align: center; }
        .menu-item span { margin-left: 10px; opacity: 1; transition: opacity 0.2s; }
        .sidebar.collapsed .menu-item span { opacity: 0; display: none; }

        /* --- 主內容區 --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 手機版靠上對齊 */
            padding: 20px;
            position: relative;
            overflow-y: auto;
            width: 100%;
        }

        .video-wrapper {
            width: 100%;
            max-width: 1000px;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- 控制面板 --- */
        .controls {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-panel);
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-group { display: flex; align-items: center; gap: 10px; }

        button.ctrl-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 10px 14px; /* 手機版按鈕稍微大一點好按 */
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        button.ctrl-btn:hover { background: #475569; }
        button.ctrl-btn:active { transform: scale(0.95); }
        button.ctrl-btn.primary { background: var(--primary-color); }
        button.ctrl-btn.primary:hover { background: #dc2626; }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 8px 15px;
            border-radius: 20px;
        }
        input[type=range] { width: 100px; cursor: pointer; }

        .info-panel {
            margin-top: 20px;
            text-align: center;
            color: var(--text-gray);
            max-width: 800px;
            padding-bottom: 40px; /* 底部留白 */
        }
        .info-title { font-size: 1.4rem; color: white; margin-bottom: 8px; }

        /* =========================================
           📱 手機版專用樣式 (Media Queries)
           ========================================= */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute; /* 改為浮動定位 */
                height: 100%;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
                transform: translateX(0); /* 預設顯示 */
            }
            
            /* 手機版收合時：完全移出畫面 */
            .sidebar.collapsed {
                width: var(--sidebar-width); /* 保持寬度，但移出去 */
                transform: translateX(-100%);
                border: none;
            }

            /* 讓漢堡選單按鈕永遠顯示在左下角，即使側邊欄收起來也能按 */
            .toggle-btn {
                position: fixed;
                bottom: 20px;
                left: 20px; 
                right: auto;
                z-index: 101;
                width: 45px; /* 按鈕加大 */
                height: 45px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
            .sidebar.collapsed .toggle-btn {
                transform: rotate(0deg); /* 手機版收合時不旋轉箭頭，改用圖示變化 */
                left: 20px;
            }

            /* 控制面板改成垂直排列 */
            .controls {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
            }
            .btn-group {
                width: 100%;
                justify-content: space-between; /* 按鈕分散對齊 */
            }
            .btn-group button {
                flex: 1; /* 按鈕平均分配寬度 */
                justify-content: center;
                display: flex;
            }
            .speed-control {
                width: 100%;
                justify-content: space-between;
            }
            input[type=range] {
                flex-grow: 1; /* 拉桿自動填滿 */
            }
            
            .main-content { padding: 10px; }
            .info-title { font-size: 1.2rem; }
            .info-panel p { font-size: 0.9rem; }
        }
    </style>
</head>

<body>

    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-volleyball"></i>
            <span style="margin-left: 10px;">Volley AI</span>
        </div>

        <ul class="menu-list">
            <li class="menu-item active" onclick="switchVideo(0)">
                <i class="fa-solid fa-file-video"></i>
                <span>原始影片 (Input)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(1)">
                <i class="fa-solid fa-volleyball"></i>
                <span>排球追蹤 (Ball)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(2)">
                <i class="fa-solid fa-vector-square"></i>
                <span>場地標線 (Court)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(3)">
                <i class="fa-solid fa-person-running"></i>
                <span>動作辨識 (Pose/RL)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(4)">
                <i class="fa-solid fa-layer-group"></i>
                <span>系統整合展示 (Result)</span>
            </li>
        </ul>

        <button class="toggle-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars" id="toggleIcon"></i>
        </button>
    </div>

    <div class="main-content" onclick="closeSidebarOnMobile()">
        <div class="video-wrapper">
            <div id="youtube-player"></div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="ctrl-btn" onclick="seekVideo(-5)"><i class="fa-solid fa-backward"></i> -5s</button>
                <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">
                    <i class="fa-solid fa-play"></i> 播放
                </button>
                <button class="ctrl-btn" onclick="seekVideo(5)">+5s <i class="fa-solid fa-forward"></i></button>
            </div>

            <div class="speed-control">
                <span style="font-size: 0.9rem; white-space: nowrap;"><i class="fa-solid fa-gauge-high"></i> 速度</span>
                <input type="range" id="speedRange" min="0.25" max="2.0" step="0.25" value="1.0" oninput="updateSpeedLabel()" onchange="setSpeed()">
                <span id="speedDisplay" style="width: 35px; text-align: right;">1.0x</span>
            </div>
        </div>

        <div class="info-panel">
            <h2 class="info-title" id="videoTitle">原始影片 (Input Video)</h2>
            <p id="videoDesc">未經任何 AI 處理的原始輸入影片，用於對照效果</p>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // ==========================================
        // 🔧 使用者設定區
        // ==========================================
        const YOUTUBE_IDS = {
            ALL: "CEBqN_nKrvQ",
            BALL: "WlAtBO79wmk",
            COURT: "g4LiFDAhquc",
            POSE: "tmJCyD4BH-c",
            ORIGIN: "elp1-DmyPKw"
        };
        // ==========================================

        const videoData = [
            { id: YOUTUBE_IDS.ORIGIN, title: "原始影片 (Input Video)", desc: "未經任何 AI 處理的原始輸入影片，用於對照效果" },
            { id: YOUTUBE_IDS.BALL, title: "排球追蹤 (Ball Tracking)", desc: "使用 YOLOv11s 進行排球偵測與卡爾曼濾波/邏輯追蹤" },
            { id: YOUTUBE_IDS.COURT, title: "場地標線 (Court Detection)", desc: "手動標記或自動偵測後的 14 點場地投影" },
            { id: YOUTUBE_IDS.POSE, title: "球員行為辨識 (Player Action)", desc: "YOLO-Pose 結合規則庫與 RL 進行動作分類 (Set, Spike, Block)" },
            { id: YOUTUBE_IDS.ALL, title: "系統整合展示 (Final Result)", desc: "結合排球軌跡、場地標線與球員行為辨識的完整輸出" }
        ];

        var player;
        var currentVideoIndex = 0;
        const playBtn = document.getElementById('playBtn');
        const speedRange = document.getElementById('speedRange');
        const speedDisplay = document.getElementById('speedDisplay');
        const sidebar = document.getElementById('sidebar');
        const toggleIcon = document.getElementById('toggleIcon');
        const menuItems = document.querySelectorAll('.menu-item');
        const titleEl = document.getElementById('videoTitle');
        const descEl = document.getElementById('videoDesc');

        // 偵測是否為手機
        const isMobile = window.innerWidth <= 768;

        // 初始化
        window.onload = function() {
            // 如果是手機，預設收起側邊欄
            if (isMobile) {
                sidebar.classList.add('collapsed');
                toggleIcon.className = "fa-solid fa-bars"; // 顯示漢堡選單圖示
            } else {
                toggleIcon.className = "fa-solid fa-chevron-left"; // 電腦版顯示箭頭
            }
        };

        function onYouTubeIframeAPIReady() {
            var originUrl = window.location.origin;
            if (originUrl === "file://") originUrl = "*";

            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: videoData[0].id,
                playerVars: { 
                    'playsinline': 1, 
                    'rel': 0, 
                    'controls': 1,
                    'enablejsapi': 1,
                    'origin': originUrl
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            updatePlayBtnIcon(event.data == YT.PlayerState.PLAYING);
            if (event.data == YT.PlayerState.PLAYING) {
                setSpeed();
            }
        }

        function switchVideo(index) {
            currentVideoIndex = index;
            menuItems.forEach(item => item.classList.remove('active'));
            menuItems[index].classList.add('active');
            titleEl.textContent = videoData[index].title;
            descEl.textContent = videoData[index].desc;

            if (player && player.loadVideoById) {
                player.loadVideoById(videoData[index].id);
            }

            // 手機版點擊選單後，自動收起側邊欄
            if (window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
                toggleIcon.className = "fa-solid fa-bars";
            }
        }

        function togglePlay() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            const state = player.getPlayerState();
            (state === YT.PlayerState.PLAYING) ? player.pauseVideo() : player.playVideo();
        }

        function updatePlayBtnIcon(isPlaying) {
            playBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i> 暫停' : '<i class="fa-solid fa-play"></i> 播放';
        }

        function seekVideo(seconds) {
            if (!player || typeof player.getCurrentTime !== 'function') return;
            player.seekTo(player.getCurrentTime() + seconds, true);
        }

        function updateSpeedLabel() {
            speedDisplay.textContent = speedRange.value + "x";
        }

        function setSpeed() {
            if (!player || typeof player.setPlaybackRate !== 'function') return;
            const rate = parseFloat(speedRange.value);
            player.setPlaybackRate(rate);
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            
            // 更新按鈕圖示
            if (sidebar.classList.contains('collapsed')) {
                // 收起狀態
                toggleIcon.className = (window.innerWidth <= 768) ? "fa-solid fa-bars" : "fa-solid fa-chevron-right";
            } else {
                // 展開狀態
                toggleIcon.className = "fa-solid fa-chevron-left";
            }
        }

        // 手機版功能：點擊主要內容區時，如果側邊欄是開的，就把它關掉
        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768 && !sidebar.classList.contains('collapsed')) {
                sidebar.classList.add('collapsed');
                toggleIcon.className = "fa-solid fa-bars";
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') seekVideo(5);
            if (e.code === 'ArrowLeft') seekVideo(-5);
        });
    </script>
</body>
</html>
