<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排球 AI 分析系統展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 60px;
            --primary-color: #3b82f6;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 側邊欄樣式 --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-panel);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: width var(--transition-speed) ease;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
        
        .logo-area {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            overflow: hidden;
        }
        
        .sidebar.collapsed .logo-area span { opacity: 0; }
        .sidebar.collapsed .logo-area i { margin-right: 0; font-size: 1.5rem; }

        .toggle-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-speed);
            z-index: 10;
        }

        .sidebar.collapsed .toggle-btn { right: 15px; transform: rotate(180deg); }

        .menu-list { list-style: none; margin-top: 20px; padding: 0 10px; }
        .menu-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-gray);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .menu-item:hover { background-color: #334155; color: white; }
        .menu-item.active { background-color: var(--primary-color); color: white; }
        .menu-item i { min-width: 30px; font-size: 1.1rem; text-align: center; }
        .menu-item span { margin-left: 10px; opacity: 1; transition: opacity 0.2s; }
        .sidebar.collapsed .menu-item span { opacity: 0; display: none; }

        /* --- 主內容區 --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        video { width: 100%; height: auto; display: block; }

        /* --- 控制面板 --- */
        .controls {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-group { display: flex; align-items: center; gap: 10px; }

        button.ctrl-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        button.ctrl-btn:hover { background: #475569; }
        button.ctrl-btn:active { transform: scale(0.95); }
        button.ctrl-btn.primary { background: var(--primary-color); }
        button.ctrl-btn.primary:hover { background: #2563eb; }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 5px 15px;
            border-radius: 20px;
        }

        input[type=range] { width: 100px; cursor: pointer; }
        
        .info-panel {
            margin-top: 20px;
            text-align: center;
            color: var(--text-gray);
        }
        .info-title { font-size: 1.5rem; color: white; margin-bottom: 5px; }

    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-volleyball"></i>
            <span style="margin-left: 10px;">Volley AI</span>
        </div>
        
        <ul class="menu-list">
            <li class="menu-item active" onclick="switchVideo(0)">
                <i class="fa-solid fa-layer-group"></i>
                <span>系統整合展示 (All)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(1)">
                <i class="fa-solid fa-baseball"></i>
                <span>排球追蹤 (Ball)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(2)">
                <i class="fa-solid fa-vector-square"></i>
                <span>場地標線 (Court)</span>
            </li>
            <li class="menu-item" onclick="switchVideo(3)">
                <i class="fa-solid fa-person-running"></i>
                <span>動作辨識 (Pose/RL)</span>
            </li>
        </ul>

        <button class="toggle-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>

    <div class="main-content">
        
        <div class="video-container">
            <video id="mainPlayer" playsinline onclick="togglePlay()">
                <source src="" type="video/mp4">
                您的瀏覽器不支援 HTML5 影片。
            </video>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="ctrl-btn" onclick="skip(-5)"><i class="fa-solid fa-backward"></i> -5s</button>
                <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">
                    <i class="fa-solid fa-play"></i> 播放
                </button>
                <button class="ctrl-btn" onclick="skip(5)">+5s <i class="fa-solid fa-forward"></i></button>
            </div>

            <div class="speed-control">
                <span style="font-size: 0.9rem;"><i class="fa-solid fa-gauge-high"></i> 速度:</span>
                <input type="range" id="speedRange" min="0.25" max="2.0" step="0.25" value="1.0" oninput="updateSpeed()">
                <span id="speedDisplay" style="width: 40px; text-align: right;">1.0x</span>
            </div>
        </div>

        <div class="info-panel">
            <h2 class="info-title" id="videoTitle">系統整合展示</h2>
            <p id="videoDesc">YOLOv11 Ball + Court Lines + Player Action Recognition 整合結果</p>
        </div>

    </div>

    <script>
        // ==========================================
        // 🔧 請在這裡修改你的影片檔名
        // ==========================================
        const videos = [
            {
                title: "系統整合展示 (Integrated)",
                desc: "結合排球軌跡、場地標線與球員行為辨識的完整輸出",
                // 對應你 Python 輸出的完整檔名
                src: "1207_Complete_Output_ALL_Ver1.mp4" 
            },
            {
                title: "排球追蹤 (Ball Tracking)",
                desc: "使用 YOLOv11s 進行排球偵測與卡爾曼濾波/邏輯追蹤",
                src: "demo_ball_only.mp4" // 請替換成單獨球的影片檔名
            },
            {
                title: "場地標線 (Court Detection)",
                desc: "手動標記或自動偵測後的 14 點場地投影",
                src: "demo_court_only.mp4" // 請替換檔名
            },
            {
                title: "球員行為辨識 (Player Action)",
                desc: "YOLO-Pose 結合規則庫與 RL 進行動作分類 (Set, Spike, Block)",
                src: "demo_player_only.mp4" // 請替換檔名
            }
        ];

        const player = document.getElementById('mainPlayer');
        const playBtn = document.getElementById('playBtn');
        const speedRange = document.getElementById('speedRange');
        const speedDisplay = document.getElementById('speedDisplay');
        const sidebar = document.getElementById('sidebar');
        const menuItems = document.querySelectorAll('.menu-item');
        const titleEl = document.getElementById('videoTitle');
        const descEl = document.getElementById('videoDesc');

        // 初始化載入第一部影片
        loadVideoSource(0);

        function switchVideo(index) {
            // 更新選單樣式
            menuItems.forEach(item => item.classList.remove('active'));
            menuItems[index].classList.add('active');

            // 更新文字資訊
            titleEl.textContent = videos[index].title;
            descEl.textContent = videos[index].desc;

            // 載入影片
            loadVideoSource(index);
        }

        function loadVideoSource(index) {
            const time = player.currentTime; // 紀錄當前時間 (如果想切換時保持時間，否則設為0)
            const isPlaying = !player.paused;
            
            player.src = videos[index].src;
            player.currentTime = 0; // 切換影片從頭開始
            
            // 重置速度
            player.playbackRate = parseFloat(speedRange.value);

            if (isPlaying) {
                player.play();
                updatePlayBtnIcon(true);
            } else {
                updatePlayBtnIcon(false);
            }
        }

        function togglePlay() {
            if (player.paused) {
                player.play();
                updatePlayBtnIcon(true);
            } else {
                player.pause();
                updatePlayBtnIcon(false);
            }
        }

        function updatePlayBtnIcon(isPlaying) {
            playBtn.innerHTML = isPlaying ? 
                '<i class="fa-solid fa-pause"></i> 暫停' : 
                '<i class="fa-solid fa-play"></i> 播放';
        }

        function skip(seconds) {
            player.currentTime += seconds;
        }

        function updateSpeed() {
            const val = speedRange.value;
            player.playbackRate = val;
            speedDisplay.textContent = val + "x";
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        // 鍵盤快捷鍵支援
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 防止空白鍵捲動網頁
                togglePlay();
            }
            if (e.code === 'ArrowRight') skip(5);
            if (e.code === 'ArrowLeft') skip(-5);
        });

    </script>
</body>
</html>
